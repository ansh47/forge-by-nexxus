name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A scaffold generator can pass its own tests while silently emitting projects
# that no longer compile, so the template jobs below scaffold each template and
# actually build the output.
jobs:
  cli:
    name: CLI build, tests and template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint templates
        run: node dist/index.js lint

  templates-node:
    name: Build ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          # buildIn is the path under /tmp/out holding the npm project to build,
          # which is the root for react-ts and frontend/ for the fullstack one.
          - name: react-ts (no add-ons)
            args: react-ts sample-app --yes
            buildIn: .
          - name: react-ts (all add-ons)
            args: react-ts sample-app --yes --set addons=framer-motion,lucide-react,tailwind,rtk-query
            buildIn: .
          - name: react-ts (tailwind + rtk-query)
            args: react-ts sample-app --yes --set addons=tailwind,rtk-query
            buildIn: .
          # The fullstack frontend with no add-ons, which takes the plain fetch
          # path rather than RTK Query. Its backend is built in templates-java.
          - name: fullstack frontend (no add-ons)
            args: fullstack-spring-react sample-stack --yes --set groupId=com.example
            buildIn: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scaffold
        run: node dist/index.js create ${{ matrix.case.args }} --dir /tmp/out
      - name: Install and build the generated project
        working-directory: /tmp/out/${{ matrix.case.buildIn }}
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          npx vite build

  templates-java:
    name: Build Java templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npm run build

      - name: Scaffold backend-spring-boot
        run: node dist/index.js create backend-spring-boot sample-api --yes --set groupId=com.example --dir /tmp/backend
      - name: Build and test it
        working-directory: /tmp/backend
        run: mvn -B -ntp package

      # Scaffolded with every frontend add-on on, so the conditional wiring
      # (Provider, store files, Tailwind plugin, dependency list) is exercised.
      # The no-add-on shape is covered by the templates-node job below.
      - name: Scaffold fullstack-spring-react
        run: node dist/index.js create fullstack-spring-react sample-stack --yes --set groupId=com.example --set addons=framer-motion,lucide-react,tailwind,rtk-query --dir /tmp/fullstack
      - name: Build and test the backend
        working-directory: /tmp/fullstack/backend
        run: mvn -B -ntp package
      - name: Install and build the frontend
        working-directory: /tmp/fullstack/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  templates-python:
    name: Build gambit template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build

      - name: Scaffold gambit
        run: node dist/index.js create gambit sample-agent --yes --dir /tmp/agent
      - name: Install and test the generated project
        working-directory: /tmp/agent
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest
