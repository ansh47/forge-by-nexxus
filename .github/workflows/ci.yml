name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A scaffold generator can pass its own tests while silently emitting projects
# that no longer compile, so the template jobs below scaffold each template and
# actually build the output.
jobs:
  cli:
    name: CLI build, tests and template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint templates
        run: node dist/index.js lint

  # Everything else here scaffolds from the checkout, which is not what anyone
  # installs. npm silently drops some filenames from a published package, and
  # .gitignore shipping this way went unnoticed through several releases, so
  # this job packs the tarball and scaffolds from the installed package
  # instead.
  packaging:
    name: Scaffold from the packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Pack and install it somewhere clean
        run: |
          TARBALL="$(npm pack --silent)"
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$TARBALL"

      - name: Every template still produces the files it ships
        working-directory: /tmp/consumer
        run: |
          set -euo pipefail
          forge() { ./node_modules/.bin/forge "$@"; }

          forge create react-ts a --yes --dir /tmp/out/a
          forge create fullstack-spring-react b --yes --set groupId=com.example --dir /tmp/out/b
          forge create backend-spring-boot c --yes --set groupId=com.example --dir /tmp/out/c
          forge create gambit d --yes --dir /tmp/out/d

          missing=0
          for f in /tmp/out/a/.gitignore \
                   /tmp/out/b/.gitignore /tmp/out/b/backend/.gitignore /tmp/out/b/frontend/.gitignore \
                   /tmp/out/c/.gitignore \
                   /tmp/out/d/.gitignore /tmp/out/d/.env.example; do
            if [ -f "$f" ]; then echo "ok      $f"; else echo "MISSING $f"; missing=1; fi
          done

          # A rename that failed to render back is worse than a missing file,
          # because the project looks complete and quietly is not.
          if find /tmp/out -name '*__dot__*' -o -name '*__if_*' -o -name '*.tmpl' | grep -q .; then
            echo "Unrendered template markers survived into the output:"
            find /tmp/out -name '*__dot__*' -o -name '*__if_*' -o -name '*.tmpl'
            missing=1
          fi

          exit $missing

  templates-node:
    name: Build ${{ matrix.case.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          # buildIn is the path under /tmp/out holding the npm project to build,
          # which is the root for react-ts and frontend/ for the fullstack one.
          - name: react-ts (no add-ons)
            args: react-ts sample-app --yes
            buildIn: .
          - name: react-ts (all add-ons)
            args: react-ts sample-app --yes --set addons=framer-motion,lucide-react,tailwind,rtk-query
            buildIn: .
          - name: react-ts (tailwind + rtk-query)
            args: react-ts sample-app --yes --set addons=tailwind,rtk-query
            buildIn: .
          # The fullstack frontend with no add-ons, which takes the plain fetch
          # path rather than RTK Query. Its backend is built in templates-java.
          - name: fullstack frontend (no add-ons)
            args: fullstack-spring-react sample-stack --yes --set groupId=com.example
            buildIn: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scaffold
        run: node dist/index.js create ${{ matrix.case.args }} --dir /tmp/out
      - name: Install and build the generated project
        working-directory: /tmp/out/${{ matrix.case.buildIn }}
        run: |
          npm install --no-audit --no-fund
          npx tsc -b
          npx vite build

      # Scaffolded projects are what other people run, so a known advisory in
      # the dependencies this template pins should fail here rather than be
      # discovered by whoever used it.
      - name: Audit the generated project
        working-directory: /tmp/out/${{ matrix.case.buildIn }}
        run: npm audit --audit-level=moderate

  templates-java:
    name: Build Java templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npm run build

      - name: Scaffold backend-spring-boot
        run: node dist/index.js create backend-spring-boot sample-api --yes --set groupId=com.example --dir /tmp/backend
      - name: Build and test it
        working-directory: /tmp/backend
        run: mvn -B -ntp package

      # Scaffolded with every frontend add-on on, so the conditional wiring
      # (Provider, store files, Tailwind plugin, dependency list) is exercised.
      # The no-add-on shape is covered by the templates-node job below.
      - name: Scaffold fullstack-spring-react
        run: node dist/index.js create fullstack-spring-react sample-stack --yes --set groupId=com.example --set addons=framer-motion,lucide-react,tailwind,rtk-query --dir /tmp/fullstack
      - name: Build and test the backend
        working-directory: /tmp/fullstack/backend
        run: mvn -B -ntp package
      - name: Install and build the frontend
        working-directory: /tmp/fullstack/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Audit the generated frontend
        working-directory: /tmp/fullstack/frontend
        run: npm audit --audit-level=moderate

  templates-python:
    name: Build gambit template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build

      - name: Scaffold gambit
        run: node dist/index.js create gambit sample-agent --yes --dir /tmp/agent
      - name: Install and test the generated project
        working-directory: /tmp/agent
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest
