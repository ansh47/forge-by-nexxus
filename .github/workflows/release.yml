name: Release

# Publishes to npm when a v* tag is pushed, using npm Trusted Publishing:
# the registry trusts a short-lived OIDC token minted by GitHub for this
# workflow, so there is no npm token stored in the repository or in secrets.
#
# One-time setup on npmjs.com, under the package's Settings then Trusted
# Publisher, choosing GitHub Actions:
#   Organization or user: ansh47
#   Repository:           forge-by-nexxus
#   Workflow filename:    release.yml
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # mint the OIDC token npm verifies

# Queue rather than cancel: a run that is midway through publishing should
# finish rather than be killed. The publish and release steps below are
# written to be safe when a version has already gone out, so a duplicate or
# manually retried run is harmless.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node may
      # predate support for it.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Lint templates
        run: node dist/index.js lint

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish to npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "Package: '$name'  Version: '$version'"
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "Could not read name or version from package.json" >&2
            exit 1
          fi

          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "$name@$version is already on the registry, nothing to publish."
          else
            npm publish
          fi

          # Verify rather than trust, because a publish that quietly does
          # nothing would otherwise leave a green run next to a version that
          # was never released.
          #
          # This reads the registry directly with a cache buster rather than
          # through npm view, whose packument responses are CDN cached: a
          # freshly published version can stay invisible to npm view for well
          # over a minute, which previously failed this step for a release
          # that had in fact succeeded.
          for attempt in $(seq 1 20); do
            if curl -fsS "https://registry.npmjs.org/$name/$version?cb=$(date +%s)-$attempt" \
                 | grep -q "\"version\"[[:space:]]*:[[:space:]]*\"$version\""; then
              echo "Confirmed $name@$version is on the registry."
              exit 0
            fi
            echo "Not visible on the registry yet, retrying ($attempt of 20)..."
            sleep 15
          done
          echo "$name@$version is still not on the registry after publishing." >&2
          exit 1

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it alone."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
