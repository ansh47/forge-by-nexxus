[project]
name = "{{projectName}}"
version = "0.1.0"
description = "{{projectNameHuman}}, scaffolded with forge."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.39.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
{{projectName}} = "{{projectNameSnake}}.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{projectNameSnake}}"]
